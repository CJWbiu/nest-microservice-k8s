apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: bookstore-microservices
data:
  PORT: "8080"
  ACCOUNT_URL: http://account
  PAYMENT_URL: http://payment
  WAREHOUSE_URL: http://warehouse
  SECURITY_URL: http://security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: bookstore-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: book-admin
      containers:
        - name: gateway
          image: bookstore/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: bookstore-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
