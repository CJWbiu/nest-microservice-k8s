apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
  namespace: bookstore-microservices
data:
  PORT: "80"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: bookstore
  DB_PASSWORD: bookstore
  DB_NAME: account
  JWT_SIGNING_KEY: 601304E0-8AD4-40B0-BD51-0B432DC47461
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: bookstore-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      serviceAccountName: book-admin
      containers:
        - name: account
          image: bookstore/account:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: account-config
---
apiVersion: v1
kind: Service
metadata:
  name: account
  namespace: bookstore-microservices
spec:
  selector:
    app: account
  ports:
    - port: 80
      targetPort: 80
