apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: bookstore-microservices
type: Opaque
stringData:
  POSTGRES_USER: bookstore
  POSTGRES_PASSWORD: bookstore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bookstore-microservices
data:
  init.sql: |
    CREATE DATABASE account;
    CREATE DATABASE warehouse;
    CREATE DATABASE payment;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookstore-microservices
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookstore-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookstore"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
