apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-microservices
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: book-admin
  namespace: bookstore-microservices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: book-admin-role
  namespace: bookstore-microservices
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: book-admin-binding
  namespace: bookstore-microservices
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: book-admin-role
subjects:
  - kind: ServiceAccount
    name: book-admin
    namespace: bookstore-microservices
